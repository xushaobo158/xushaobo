<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="徐少柏 / Xushaobo 的 UI/UX 设计作品集，展示产品体验、交互设计与视觉设计项目。"
    />
    <meta name="theme-color" content="#070808" />
    <title>徐少柏 / Xushaobo - UI/UX Designer</title>
    <script>
      (() => {
        const route = window.location.pathname.replace(/\/$/, '');
        const projectCover = {
          '/projects/social-app': 'social-app/01-cover.webp',
          '/projects/file-tool': 'file-tool/01-cover.webp',
        }[route];

        if (!projectCover) return;

        const mobile = window.matchMedia('(max-width: 700px)').matches;
        const asset = mobile ? projectCover.replace(/\/([^/]+)$/, '/mobile/$1') : projectCover;
        const preload = document.createElement('link');
        preload.rel = 'preload';
        preload.as = 'image';
        preload.href = `/assets/${asset}`;
        preload.fetchPriority = 'high';
        document.head.appendChild(preload);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
